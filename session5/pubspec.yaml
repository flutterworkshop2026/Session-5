name: todo_app
description: A simple todo app UI shown with setState, MVVM, Cubit, and Bloc.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  bloc: ^8.1.4
  meta: ^1.17.0
  dio: ^5.11.1
  http: ^1.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
